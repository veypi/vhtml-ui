<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="Dropdown Component Documentation" />
  <title>{{ $t('dropdown.title') }}</title>
</head>

<body>
  <div class="doc-page">
    <h1 class="doc-title">{{ $t('dropdown.title') }}</h1>
    <p class="doc-intro">{{ $t('dropdown.intro') }}</p>

    <h2 class="doc-h2">{{ $t('doc.examples') }}</h2>

    <doc-demo :title="$t('dropdown.ex.basic.title')" :desc="$t('dropdown.ex.basic.desc')" :code="codeBasic">
      <div class="v-flex v-gap-md v-flex-wrap">
        <div vsrc="/dropdown" :items="menuItems" @command="handleCommand">
          <div vsrc="/btn">
            Dropdown
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
        <div vsrc="/dropdown" :items="menuItems" placement="top-end" @command="handleCommand">
          <div vsrc="/btn" variant="outline">{{ $t('dropdown.topEnd') }}</div>
        </div>
      </div>
    </doc-demo>

    <doc-demo :title="$t('dropdown.ex.custom.title')" :desc="$t('dropdown.ex.custom.desc')" :code="codeCustom">
      <div vsrc="/dropdown">
        <div vsrc="/btn" color="secondary">{{ $t('dropdown.userInfo') }}</div>
        <div vslot="menu" class="v-p-sm">
          <div class="v-text-secondary v-text-xs v-mb-xs">{{ $t('dropdown.userInfo') }}</div>
          <div class="v-font-bold">{{ $t('dropdown.admin') }}</div>
          <div class="v-my-sm" style="border-top: 1px solid var(--v-border-color)"></div>
          <div vsrc="/btn" size="sm" :block="true">{{ $t('dropdown.logout') }}</div>
        </div>
      </div>
    </doc-demo>

    <h2 class="doc-h2">{{ $t('doc.api') }}</h2>

    <doc-api :title="$t('doc.props')" :rows="propRows"></doc-api>
    <doc-api :title="$t('doc.events')" :rows="eventRows"></doc-api>
    <doc-api :title="$t('doc.slots')" :rows="slotRows"></doc-api>
  </div>

  <script setup>
    menuItems = [
      { label: () => $t('dropdown.action1'), value: '1' },
      { label: () => $t('dropdown.action2'), value: '2' },
      { label: () => $t('dropdown.action3'), value: '3', divided: true },
      { label: () => $t('dropdown.disabled'), value: '4', disabled: true }
    ];

    handleCommand = (val) => {
      $message.info($t('dropdown.selected') + ': ' + val);
    };

    codeBasic = `<div vsrc="/dropdown" :items="menuItems" @command="handleCommand">
  <div vsrc="/btn">Dropdown</div>
</div>

<script setup>
  menuItems = [
    { label: 'Action 1', value: '1' },
    { label: 'Action 2', value: '2' },
    { label: 'Action 3', value: '3', divided: true },
    { label: 'Disabled', value: '4', disabled: true }
  ];

  handleCommand = (val) => {
    $message.info('Selected: ' + val);
  };
<\/script>`;

    codeCustom = `<div vsrc="/dropdown">
  <div vsrc="/btn" color="secondary">User</div>
  <div vslot="menu">
    <div>Admin</div>
    <div vsrc="/btn" size="sm" :block="true">Logout</div>
  </div>
</div>`;

    propRows = [
      { name: 'placement', desc: $t('dropdown.api.placement'), type: "'bottom-start' | 'bottom-end' | 'top-start' | 'top-end'", default: "'bottom-start'" },
      { name: 'items', desc: $t('dropdown.api.items'), type: 'array', default: '[]' }
    ];

    eventRows = [
      { name: 'command', desc: $t('dropdown.api.command'), type: '(value: any)', default: '-' }
    ];

    slotRows = [
      { name: 'default', desc: $t('dropdown.api.slotDefault'), type: '-', default: '-' },
      { name: 'menu', desc: $t('dropdown.api.slotMenu'), type: '-', default: '-' }
    ];
  </script>
</body>

</html>
