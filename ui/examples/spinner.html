<!doctype html>
<html>

<head>
  <meta name="description" content="Spinner Component Demo" />
  <title>{{$t('spinner.title')}}</title>
</head>

<body>
  <div class="section-title">{{$t('spinner.title')}}</div>

  <div class="demo-section">
    <span class="demo-label">{{$t('spinner.sizes')}}</span>
    <div class="v-flex v-gap-md v-items-center v-mb-md">
      <div vsrc="/spinner.html" size="sm"></div>
      <div vsrc="/spinner.html" size="md"></div>
      <div vsrc="/spinner.html" size="lg"></div>
      <div vsrc="/spinner.html" :size="56"></div>
    </div>

    <span class="demo-label">{{$t('spinner.colors')}}</span>
    <div class="v-flex v-gap-md v-items-center v-mb-md">
      <div vsrc="/spinner.html"></div>
      <div vsrc="/spinner.html" color="var(--v-color-success)"></div>
      <div vsrc="/spinner.html" color="var(--v-color-danger)"></div>
      <div vsrc="/spinner.html" color="#9333ea"></div>
    </div>

    <span class="demo-label">{{$t('spinner.withText')}}</span>
    <div class="v-flex v-gap-md v-items-center">
      <div vsrc="/spinner.html" :text="$t('spinner.loading')"></div>
    </div>
  </div>
</body>

</html>
