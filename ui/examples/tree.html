<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Tree Component Documentation" />
  <title>{{ $t('tree.title') }}</title>
</head>
<style>
  .tree-demo-panel {
    max-width: 360px;
    padding: var(--v-spacing-md);
    border: 1px solid var(--v-border-color);
    border-radius: var(--v-radius-md);
  }

  .tree-custom-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 4px;
    border-radius: var(--v-radius-sm);
    cursor: pointer;
  }

  .tree-custom-row:hover {
    background: var(--v-bg-color-secondary);
  }

  .tree-arrow {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--v-text-color-tertiary);
    transition: transform var(--v-transition-fast);
  }

  .tree-arrow.is-expanded {
    transform: rotate(90deg);
  }

  .tree-icon {
    width: 16px;
    height: 16px;
    display: inline-flex;
  }

  .tree-icon svg {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <div class="doc-page">
    <h1 class="doc-title">{{ $t('tree.title') }}</h1>
    <p class="doc-intro">{{ $t('tree.intro') }}</p>

    <h2 class="doc-h2">{{ $t('doc.examples') }}</h2>

    <doc-demo :title="$t('tree.ex.basic.title')" :desc="$t('tree.ex.basic.desc')" :code="codeBasic">
      <div class="tree-demo-panel">
        <div vsrc="/tree" :items="fileTreeData"></div>
      </div>
    </doc-demo>

    <doc-demo :title="$t('tree.ex.custom.title')" :desc="$t('tree.ex.custom.desc')" :code="codeCustom">
      <div class="tree-demo-panel">
        <div vsrc="/tree" :items="fileTreeData">
          <div class="tree-custom-row" :style="{paddingLeft: (depth * 20) + 'px'}" @click="toggleRow(row)">
            <span class="tree-arrow" :class="{ 'is-expanded': row.expand }">
              <svg v-if="row.items && row.items.length" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </span>
            <span class="tree-icon" v-html="row.items ? iconFolder : iconFile"></span>
            <span>{{ row.name }}</span>
          </div>
        </div>
      </div>
    </doc-demo>

    <h2 class="doc-h2">{{ $t('doc.api') }}</h2>

    <doc-api :title="$t('doc.props')" :rows="propRows"></doc-api>
    <doc-api :title="$t('doc.slots')" :rows="slotRows"></doc-api>
  </div>

  <script setup>
    iconFolder = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--v-color-warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';
    iconFile = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--v-text-color-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';

    toggleRow = (row) => {
      if (row.items && row.items.length) {
        row.expand = !row.expand;
      }
    };

    fileTreeData = [
      {
        name: 'vhtml-ui',
        expand: true,
        items: [
          {
            name: 'ui',
            expand: true,
            items: [
              {name: 'btn.html'},
              {name: 'input.html'},
              {name: 'tree.html'},
              {name: 'global.css'}
            ]
          },
          {
            name: 'examples',
            items: [
              {name: 'btn.html'},
              {name: 'tree.html'}
            ]
          },
          {name: 'README.md'},
          {name: '.gitignore'}
        ]
      }
    ];

    codeBasic = `<div vsrc="/tree" :items="fileTreeData"></div>

<script setup>
  fileTreeData = [
    {
      name: 'vhtml-ui',
      expand: true,
      items: [
        { name: 'ui', items: [{ name: 'btn.html' }] },
        { name: 'README.md' }
      ]
    }
  ];
<\/script>`;

    codeCustom = `<div vsrc="/tree" :items="fileTreeData">
  <!-- vbind 提供 row 与 depth -->
  <div :style="{paddingLeft: (depth * 20) + 'px'}" @click="toggleRow(row)">
    <span>{{ row.name }}</span>
  </div>
</div>

<script setup>
  toggleRow = (row) => {
    if (row.items && row.items.length) {
      row.expand = !row.expand;
    }
  };
<\/script>`;

    propRows = [
      {name: 'items', desc: $t('tree.api.items'), type: 'array', default: '[]'},
      {name: 'depth', desc: $t('tree.api.depth'), type: 'number', default: '0'}
    ];

    slotRows = [
      {name: 'default', desc: $t('tree.api.slotDefault'), type: '-', default: '-'}
    ];
  </script>
</body>

</html>
