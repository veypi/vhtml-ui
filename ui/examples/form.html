<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Form Component Demo">
  <title>{{$t('form.title')}}</title>
</head>
<style>
  .demo-narrow {
    max-width: 640px;
    margin: 0 auto;
  }

  .demo-result {
    margin-top: 30px;
    padding: 16px;
    background: var(--v-bg-color-secondary);
    border-radius: var(--v-radius-md);
  }

  .demo-result pre {
    margin: 0;
    font-size: 12px;
    color: var(--v-text-color-secondary);
  }
</style>

<body>
  <div class="section-title">{{$t('form.title')}}</div>

  <div class="demo-narrow">
    <div vsrc="/form.html" :items="formItems" v:data="formData" :cols="2" @submit="onSubmit" @reset="onReset"></div>

    <div class="demo-result">
      <h4 style="margin-top: 0;">{{$t('form.liveData')}}:</h4>
      <pre>{{ JSON.stringify(formData, null, 2) }}</pre>
    </div>
  </div>
</body>

<script setup>
  formData = {
    name: 'John Doe',
    age: 25,
    city: 'bj',
    roles: ['dev'],
    agree: true,
    bio: ''
  };

  formItems = [
    {
      name: 'name',
      label: () => $t('form.name'),
      placeholder: () => $t('form.namePlaceholder'),
      required: true
    },
    {
      name: 'age',
      type: 'number',
      label: () => $t('form.age'),
      placeholder: () => $t('form.agePlaceholder'),
      validate: /^\d+$/
    },
    {
      name: 'city',
      type: 'select',
      label: () => $t('form.city'),
      opts: {
        options: [
          {label: () => $t('form.beijing'), value: 'bj'},
          {label: () => $t('form.shanghai'), value: 'sh'},
          {label: () => $t('form.guangzhou'), value: 'gz'}
        ]
      }
    },
    {
      name: 'roles',
      type: 'checkbox',
      label: () => $t('form.roles'),
      opts: {
        options: [
          {label: () => $t('form.dev'), value: 'dev'},
          {label: () => $t('form.des'), value: 'des'},
          {label: () => $t('form.pm'), value: 'pm'}
        ]
      }
    },
    {
      name: 'bio',
      type: 'textarea',
      label: () => $t('form.bio'),
      placeholder: () => $t('form.bioPlaceholder'),
      opts: {rows: 4},
      full: true
    },
    {
      name: 'agree',
      type: 'checkbox',
      placeholder: () => $t('form.agreeProtocol'),
      required: true,
      full: true
    }
  ];

  onSubmit = (data) => {
    $message.success($t('form.submitSuccess'));
  };

  onReset = () => {
    $message.info($t('form.resetMsg'));
  };
</script>

</html>
