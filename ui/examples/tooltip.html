<!doctype html>
<html>

<head>
  <meta name="description" content="Tooltip Component Documentation" />
  <title>{{ $t('tooltip.title') }}</title>
</head>

<body>
  <div class="doc-page">
    <h1 class="doc-title">{{ $t('tooltip.title') }}</h1>
    <p class="doc-intro">{{ $t('tooltip.intro') }}</p>

    <h2 class="doc-h2">{{ $t('doc.examples') }}</h2>

    <doc-demo :title="$t('tooltip.ex.placement.title')" :desc="$t('tooltip.ex.placement.desc')" :code="codePlacement">
      <div class="v-flex v-gap-md v-flex-wrap">
        <div vsrc="/tooltip" :content="$t('tooltip.topTip')" placement="top">
          <div vsrc="/btn" variant="outline">Top</div>
        </div>
        <div vsrc="/tooltip" :content="$t('tooltip.bottomTip')" placement="bottom">
          <div vsrc="/btn" variant="outline">Bottom</div>
        </div>
        <div vsrc="/tooltip" :content="$t('tooltip.leftTip')" placement="left">
          <div vsrc="/btn" variant="outline">Left</div>
        </div>
        <div vsrc="/tooltip" :content="$t('tooltip.rightTip')" placement="right">
          <div vsrc="/btn" variant="outline">Right</div>
        </div>
      </div>
    </doc-demo>

    <doc-demo :title="$t('tooltip.ex.trigger.title')" :desc="$t('tooltip.ex.trigger.desc')" :code="codeTrigger">
      <div vsrc="/tooltip" :content="$t('tooltip.topTip')" trigger="click">
        <div vsrc="/btn">{{ $t('tooltip.clickMe') }}</div>
      </div>
    </doc-demo>

    <h2 class="doc-h2">{{ $t('doc.api') }}</h2>

    <doc-api :title="$t('doc.props')" :rows="propRows"></doc-api>
    <doc-api :title="$t('doc.slots')" :rows="slotRows"></doc-api>
  </div>

  <script setup>
    codePlacement = `<div vsrc="/tooltip" content="Top tip" placement="top">
  <div vsrc="/btn" variant="outline">Top</div>
</div>
<div vsrc="/tooltip" content="Bottom tip" placement="bottom">
  <div vsrc="/btn" variant="outline">Bottom</div>
</div>
<div vsrc="/tooltip" content="Left tip" placement="left">
  <div vsrc="/btn" variant="outline">Left</div>
</div>
<div vsrc="/tooltip" content="Right tip" placement="right">
  <div vsrc="/btn" variant="outline">Right</div>
</div>`;

    codeTrigger = `<div vsrc="/tooltip" content="Tip content" trigger="click">
  <div vsrc="/btn">Click Me</div>
</div>`;

    propRows = [
      { name: 'content', desc: $t('tooltip.api.content'), type: 'string', default: "''" },
      { name: 'placement', desc: $t('tooltip.api.placement'), type: "'top' | 'bottom' | 'left' | 'right'", default: "'top'" },
      { name: 'trigger', desc: $t('tooltip.api.trigger'), type: "'hover' | 'click'", default: "'hover'" },
      { name: 'delay', desc: $t('tooltip.api.delay'), type: 'number', default: '100' }
    ];

    slotRows = [
      { name: 'default', desc: $t('tooltip.api.slotDefault'), type: '-', default: '-' }
    ];
  </script>
</body>

</html>
