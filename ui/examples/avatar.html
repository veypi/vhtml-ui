<!doctype html>
<html>

<head>
  <meta name="description" content="Avatar Component Documentation" />
  <title>{{ $t('avatar.title') }}</title>
</head>

<body>
  <div class="doc-page">
    <h1 class="doc-title">{{ $t('avatar.title') }}</h1>
    <p class="doc-intro">{{ $t('avatar.intro') }}</p>

    <h2 class="doc-h2">{{ $t('doc.examples') }}</h2>

    <doc-demo :title="$t('avatar.ex.size.title')" :desc="$t('avatar.ex.size.desc')" :code="codeSize">
      <div class="v-flex v-gap-md v-items-end">
        <div vsrc="/avatar" name="Alice" size="sm"></div>
        <div vsrc="/avatar" name="Bob" size="md"></div>
        <div vsrc="/avatar" name="Carol" size="lg"></div>
        <div vsrc="/avatar" name="David" :size="64"></div>
      </div>
    </doc-demo>

    <doc-demo :title="$t('avatar.ex.shape.title')" :desc="$t('avatar.ex.shape.desc')" :code="codeShape">
      <div class="v-flex v-gap-md v-items-center">
        <div vsrc="/avatar" src="https://public.veypi.com/img/avatar/0145.jpg" name="User"></div>
        <div vsrc="/avatar" name="Circle" shape="circle"></div>
        <div vsrc="/avatar" name="Square" shape="square"></div>
        <div vsrc="/avatar" src="https://invalid.example.com/x.jpg" name="Fallback"></div>
        <div vsrc="/avatar"></div>
      </div>
    </doc-demo>

    <h2 class="doc-h2">{{ $t('doc.api') }}</h2>

    <doc-api :title="$t('doc.props')" :rows="propRows"></doc-api>
  </div>

  <script setup>
    codeSize = `<div vsrc="/avatar" name="Alice" size="sm"></div>
<div vsrc="/avatar" name="Bob" size="md"></div>
<div vsrc="/avatar" name="Carol" size="lg"></div>

<!-- 数字按 px 处理 -->
<div vsrc="/avatar" name="David" :size="64"></div>`;

    codeShape = `<!-- 图片头像 -->
<div vsrc="/avatar" src="/img/user.jpg" name="User"></div>

<!-- 形状：circle / square -->
<div vsrc="/avatar" name="Circle" shape="circle"></div>
<div vsrc="/avatar" name="Square" shape="square"></div>

<!-- 加载失败自动回退首字符 -->
<div vsrc="/avatar" src="https://invalid.example.com/x.jpg" name="Fallback"></div>`;

    propRows = [
      { name: 'src', desc: $t('avatar.api.src'), type: 'string', default: "''" },
      { name: 'name', desc: $t('avatar.api.name'), type: 'string', default: "''" },
      { name: 'size', desc: $t('avatar.api.size'), type: "'sm' | 'md' | 'lg' | number", default: "'md'" },
      { name: 'shape', desc: $t('avatar.api.shape'), type: "'circle' | 'square'", default: "'circle'" }
    ];
  </script>
</body>

</html>
