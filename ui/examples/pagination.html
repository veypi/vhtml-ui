<!doctype html>
<html>

<head>
  <meta name="description" content="Pagination Component Documentation" />
  <title>{{ $t('pagination.title') }}</title>
</head>

<body>
  <div class="doc-page">
    <h1 class="doc-title">{{ $t('pagination.title') }}</h1>
    <p class="doc-intro">{{ $t('pagination.intro') }}</p>

    <h2 class="doc-h2">{{ $t('doc.examples') }}</h2>

    <doc-demo :title="$t('pagination.ex.basic.title')" :desc="$t('pagination.ex.basic.desc')" :code="codeBasic">
      <div vsrc="/pagination" v:value="page1" :total="50"></div>
      <div class="value-display">{{ $t('pagination.current') }}: {{ page1 }}</div>
    </doc-demo>

    <doc-demo :title="$t('pagination.ex.many.title')" :desc="$t('pagination.ex.many.desc')" :code="codeMany">
      <div vsrc="/pagination" v:value="page2" :total="500"></div>
      <div class="value-display">{{ $t('pagination.current') }}: {{ page2 }}</div>
    </doc-demo>

    <doc-demo :title="$t('pagination.ex.total.title')" :desc="$t('pagination.ex.total.desc')" :code="codeTable">
      <div vsrc="/table" :columns="columns" :data="pageData()"></div>
      <div class="v-mt-md v-flex v-justify-end">
        <div vsrc="/pagination" v:value="page3" :total="allData.length" :pageSize="3" showTotal></div>
      </div>
    </doc-demo>

    <h2 class="doc-h2">{{ $t('doc.api') }}</h2>

    <doc-api :title="$t('doc.props')" :rows="propRows"></doc-api>
    <doc-api :title="$t('doc.events')" :rows="eventRows"></doc-api>
  </div>

  <script setup>
    page1 = 1;
    page2 = 5;
    page3 = 1;

    columns = [
      {key: 'name', label: () => $t('table.name')},
      {key: 'role', label: () => $t('table.role')}
    ];

    allData = [
      {name: 'Alice', role: 'Developer'},
      {name: 'Bob', role: 'Designer'},
      {name: 'Carol', role: 'Manager'},
      {name: 'David', role: 'Developer'},
      {name: 'Eve', role: 'Tester'},
      {name: 'Frank', role: 'Developer'},
      {name: 'Grace', role: 'Designer'}
    ];

    pageData = () => {
      const start = (page3 - 1) * 3;
      return allData.slice(start, start + 3);
    };

    codeBasic = `<div vsrc="/pagination" v:value="page" :total="50"></div>

<script setup>
  page = 1;
<\/script>`;

    codeMany = `<!-- 50 页自动折叠为省略号 -->
<div vsrc="/pagination" v:value="page" :total="500"></div>

<script setup>
  page = 5;
<\/script>`;

    codeTable = `<div vsrc="/table" :columns="columns" :data="pageData()"></div>
<div vsrc="/pagination" v:value="page" :total="allData.length" :pageSize="3" showTotal></div>

<script setup>
  page = 1;

  pageData = () => {
    const start = (page - 1) * 3;
    return allData.slice(start, start + 3);
  };
<\/script>`;

    propRows = [
      {name: 'value', desc: $t('pagination.api.value'), type: 'number', default: '1'},
      {name: 'total', desc: $t('pagination.api.total'), type: 'number', default: '0'},
      {name: 'pageSize', desc: $t('pagination.api.pageSize'), type: 'number', default: '10'},
      {name: 'maxButtons', desc: $t('pagination.api.maxButtons'), type: 'number', default: '7'},
      {name: 'showTotal', desc: $t('pagination.api.showTotal'), type: 'boolean', default: 'false'}
    ];

    eventRows = [
      {name: 'update', desc: $t('pagination.api.update'), type: '(page: number)', default: '-'}
    ];
  </script>
</body>

</html>
