<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Avatar Component">
  <title>Avatar</title>
</head>
<style>
  body {
    display: inline-block;
    vertical-align: middle;
  }

  .v-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: color-mix(in srgb, var(--v-color-primary) 15%, transparent);
    color: var(--v-color-primary);
    font-weight: var(--v-font-weight-medium);
    user-select: none;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  .v-avatar.is-circle {
    border-radius: 50%;
  }

  .v-avatar.is-square {
    border-radius: var(--v-radius-md);
  }

  .v-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

<body>
  <span class="v-avatar" :class="'is-' + shape" :style="computeStyle">
    <img v-if="src && !loadError" :src="icon_url()" :alt="name" @error="loadError = true" />
    <span v-else>{{ initial() }}</span>
  </span>
</body>
<script setup>
  src = '';
  name = '';    // 无图时兜底显示首字符
  size = 'md';  // sm | md | lg | 数字 px
  shape = 'circle'; // circle | square

  loadError = false;

  resolveSize = () => {
    if (typeof size === 'number') return size;
    switch (size) {
      case 'sm': return 28;
      case 'lg': return 48;
      default: return 36;
    }
  }

  computeStyle = () => {
    const s = resolveSize();
    return {
      width: s + 'px',
      height: s + 'px',
      'font-size': Math.round(s * 0.42) + 'px'
    };
  }
  icon_url = () => {
    if (src.startsWith('http')) {
      return src
    }
    return '@' + prefix + src
  }
  prefix = ''

  initial = () => (name || '?').trim().charAt(0).toUpperCase();
</script>
<script>
  prefix = $node.parentNode.closest('[vref]').$mod.scoped
  // src 变化时重置错误态
  $watch(() => $data.src, () => {loadError = false})
</script>

</html>
