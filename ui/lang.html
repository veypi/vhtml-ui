<!DOCTYPE html>
<html>
<style>
  body {
    display: inline-block;
    /* 尺寸跟宿主高度走：外部直接给 v-lang 设 height 即可，宽度随纵横比 */
    height: 100%;
    /* 宿主没给高度时的兜底，保证始终有可点击的 24px 见方目标 */
    min-height: 24px;
    aspect-ratio: 1 / 1;
  }

  .lang-toggle {
    width: 100%;
    height: 100%;
    cursor: pointer;
    user-select: none;
    transition: transform var(--v-transition-base);
  }

  .lang-toggle:hover {
    transform: translateY(-1px);
  }

  .lang-toggle:active {
    transform: scale(0.92);
  }

  .lang-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 外圈底环（保持中性色，hover 不变色——否则点击时与扫环同色，扫过动画不可见） */
  .ring-bg {
    fill: none;
    stroke: var(--v-border-color);
    stroke-width: 1.5;
    transition: stroke var(--v-transition-fast);
  }

  /* 文字：垂直滚动切换——旧词向上滚出，新词自下方滚入并轻微回弹 */
  .lang-label {
    fill: var(--v-text-color-secondary);
    font-weight: var(--v-font-weight-bold, 600);
    text-anchor: middle;
    transition: transform 340ms cubic-bezier(0.34, 1.35, 0.64, 1), opacity 240ms ease;
  }

  .lang-toggle:hover .lang-label {
    fill: var(--v-color-primary);
  }

  /* 当前中文 → 显示 EN（点击切到英文）；当前英文 → 显示 中 */
  .label-en { opacity: 1; transform: translateY(0); }
  .label-zh { opacity: 0; transform: translateY(5px); }

  .lang-toggle.en .label-en { opacity: 0; transform: translateY(-5px); }
  .lang-toggle.en .label-zh { opacity: 1; transform: translateY(0); }
</style>

<body>
  <div class="lang-toggle" :class="{en: currentLang === 'en-US'}" @click="toggleLang"
    :title="currentLang === 'en-US' ? 'Switch to 中文' : '切换到 English'">
    <svg class="lang-svg" viewBox="0 0 24 24">
      <circle class="ring-bg" cx="12" cy="12" r="10" />
      <text class="lang-label label-en" x="12" y="14.9" font-size="8" letter-spacing="0.5">EN</text>
      <text class="lang-label label-zh" x="12" y="15.8" font-size="11">中</text>
    </svg>
  </div>
</body>

<script setup>
  currentLang = $i18n.getLocale()
  toggleLang = () => {
    const newLang = currentLang === 'zh-CN' ? 'en-US' : 'zh-CN';
    $i18n.setLocale(newLang);
    currentLang = newLang;
  };
</script>
<script>
  // 外部调用 $i18n.setLocale 时同步图标状态
  $watch(() => $i18n.getLocale(), (v) => {currentLang = v})
</script>

</html>
