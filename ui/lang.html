<!DOCTYPE html>
<html>
<style>
  body {
    display: inline-block;
    /* 尺寸跟宿主高度走：外部直接给 v-lang 设 height 即可，宽度随纵横比 */
    height: 100%;
    /* 宿主没给高度时的兜底：height:100% 会塌成 0（.lang-toggle 是 container-type:size，
       图标跟着 100cqmin 一起消失），保证始终有可点击的 24px 见方目标 */
    min-height: 24px;
    aspect-ratio: 1 / 1;
  }

  .lang-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    /* 尺寸容器：内部 icon 用 cqmin 取宽高中小值自适应 */
    container-type: size;
    cursor: pointer;
    transition: all var(--v-transition-base);
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .lang-toggle:hover {
    border-color: var(--v-color-primary);
    transform: translateY(-1px);
  }

  .lang-toggle:active {
    transform: scale(0.95);
  }

  .lang-icon {
    /* 填满容器（取宽高中小值），视觉边距由 SVG viewBox 自带留白（≈8%）决定 */
    width: 100cqmin;
    height: 100cqmin;
    position: absolute;
    transition: all var(--v-transition-base);
  }

  /* 中文图标 - 默认显示 */
  .icon-zh {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }

  .lang-toggle.en .icon-zh {
    opacity: 0;
    transform: rotate(-90deg) scale(0.5);
  }

  /* 英文图标 - 默认隐藏 */
  .icon-en {
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
  }

  .lang-toggle.en .icon-en {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }

  /* 图标颜色 */
  .lang-icon path,
  .lang-icon circle,
  .lang-icon line,
  .lang-icon rect {
    stroke: var(--v-text-color-secondary);
    transition: stroke var(--v-transition-fast);
  }

  .lang-icon text {
    fill: var(--v-text-color-secondary);
    transition: fill var(--v-transition-fast);
  }

  .lang-toggle:hover .lang-icon path,
  .lang-toggle:hover .lang-icon circle,
  .lang-toggle:hover .lang-icon line,
  .lang-toggle:hover .lang-icon rect {
    stroke: var(--v-color-primary);
  }

  .lang-toggle:hover .icon-zh text {
    fill: var(--v-color-primary) !important;
  }

  /* 文字样式 */
  .lang-text {
    font-size: 11px;
    font-weight: var(--v-font-weight-bold);
    fill: var(--v-text-color-secondary);
    transition: fill var(--v-transition-fast);
  }

  .lang-toggle:hover .lang-text {
    fill: var(--v-color-primary);
  }
</style>

<body>
  <div class="lang-toggle" :class="{en: currentLang === 'en-US'}" @click="toggleLang"
    title="点击切换语言 / Click to switch language">
    <!-- 中文图标 -->
    <svg class="lang-icon icon-zh" viewBox="0 0 24 24" fill="none">
      <text x="12" y="17.5" font-size="16" font-weight="600" text-anchor="middle" fill="var(--v-color-primary)">中</text>
    </svg>
    <!-- 英文图标 -->
    <svg class="lang-icon icon-en" viewBox="0 0 24 24" fill="none" stroke="var(--v-color-primary)" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
  </div>
</body>

<script setup>
  currentLang = $i18n.getLocale()
  toggleLang = () => {
    const newLang = currentLang === 'zh-CN' ? 'en-US' : 'zh-CN';
    $i18n.setLocale(newLang);
    currentLang = newLang;
  };
</script>
<script>
  // 外部调用 $i18n.setLocale 时同步图标状态
  $watch(() => $i18n.getLocale(), (v) => {currentLang = v})
</script>

</html>
