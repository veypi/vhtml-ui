<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Dialog Modal Component" />
    <title>Dialog</title>
  </head>
  <style>
    .v-dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: color-mix(
        in srgb,
        var(--v-text-color) 38%,
        transparent
      );
      z-index: var(--v-z-modal, 1000);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .v-dialog {
      background-color: var(--v-bg-color);
      border-radius: var(--v-radius-lg);
      box-shadow: var(--v-shadow-lg);
      display: flex;
      flex-direction: column;
      max-width: 90vw;
      max-height: 85vh;
      animation: v-dialog-fade-in 0.3s ease-out;
      position: relative;
    }

    @keyframes v-dialog-fade-in {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .v-dialog-header {
      padding: var(--v-spacing-md) var(--v-spacing-lg);
      border-bottom: 1px solid var(--v-border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .v-dialog-title {
      font-size: var(--v-font-size-lg);
      font-weight: var(--v-font-weight-bold);
      color: var(--v-text-color);
    }

    .v-dialog-close {
      cursor: pointer;
      color: var(--v-text-color-secondary);
      font-size: 1.5rem;
      line-height: 1;
      transition: color 0.2s;
      background: transparent;
      border: none;
      padding: 0;
    }

    .v-dialog-close:hover {
      color: var(--v-text-color);
    }

    .v-dialog-body {
      padding: var(--v-spacing-lg);
      overflow-y: auto;
      flex: 1;
      color: var(--v-text-color);
    }

    .v-dialog-footer {
      padding: var(--v-spacing-md) var(--v-spacing-lg);
      border-top: 1px solid var(--v-border-color);
      text-align: right;
      display: flex;
      justify-content: flex-end;
      gap: var(--v-spacing-sm);
    }

    .v-dialog--compact {
      background-color: transparent;
      border-radius: 0;
      box-shadow: none;
      max-width: none;
      max-height: none;
      animation: none;
    }

    .v-dialog-body--compact {
      padding: 0;
      overflow-y: visible;
    }

    .v-dialog-close--compact {
      position: absolute;
      top: -12px;
      right: -12px;
      z-index: 1;
      color: var(--v-text-color);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      background: var(--v-bg-color);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .v-dialog-close--compact:hover {
      opacity: 0.7;
    }
  </style>

  <body>
    <!--
      懒创建：v-if="opened" 保证未打开过的对话框零 DOM 驻留（只有注释标记）；
      首次 visible=true 时才编译 overlay 并 teleport 到 body，之后用 v-show 切换。
      列表场景（如每条消息一个灯箱）下，未打开的对话框不再常驻 document.body。
    -->
    <div
      v-if="opened"
      v-show="visible"
      class="v-dialog-overlay"
      :class="{ 'v-dialog-overlay--compact': compact }"
      @click="handleOverlayClick"
      :style="compact ? '' : 'background-color:' + background"
    >
      <div
        class="v-dialog"
        :class="{ 'v-dialog--compact': compact }"
        :style="compact ? '' : 'width:' + width"
        @click="stopProp"
      >
        <vslot v-if="!compact" name="title" class="v-dialog-header">
          <span class="v-dialog-title">{{ title }}</span>
          <button class="v-dialog-close" @click="handleClose">×</button>
        </vslot>

        <vslot
          class="v-dialog-body"
          :class="{ 'v-dialog-body--compact': compact }"
        ></vslot>

        <vslot v-if="!compact" class="v-dialog-footer" name="footer"> </vslot>

        <button v-if="compact" class="v-dialog-close--compact" @click="handleClose">×</button>
      </div>
    </div>
  </body>
  <script setup>
    visible = false;
    title = "Dialog";
    width = "50%";
    closeOnClickModal = true;
    compact = false;
    background = "color-mix(in srgb, var(--v-text-color) 38%, transparent)";

    handleClose = () => {
      visible = false;
      $emit("v-close");
    };

    handleOverlayClick = () => {
      if (closeOnClickModal) {
        handleClose();
      }
    };

    stopProp = (e) => {
      e.stopPropagation();
    };
    // opened 驱动 v-if 懒创建；overlayEl/teleported 记录 teleport 状态
    opened = false;
    overlayEl = null;
    teleported = false;
    prevOverflow = "";
    onKeydown = null;
  </script>

  <script>
    // Esc 关闭与 body 滚动锁：仅 visible 期间生效
    onKeydown = (e) => {
      if (e.key === "Escape" && visible) handleClose();
    };

    ensureOverlayAttached = () => {
      if (teleported) return true;
      overlayEl = $node.querySelector(".v-dialog-overlay");
      if (overlayEl) {
        document.body.appendChild(overlayEl);
        teleported = true;
        return true;
      }
      return false;
    };

    openDialog = () => {
      if (!opened) opened = true;
      // v-if 分支在响应式冲刷期插入并编译，短轮询等待其出现后再 teleport
      let tries = 0;
      const tryAttach = () => {
        if (ensureOverlayAttached()) {
          prevOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          document.addEventListener("keydown", onKeydown);
        } else if (++tries < 10) {
          setTimeout(tryAttach, 16);
        }
      };
      setTimeout(tryAttach, 0);
    };

    closeDialog = () => {
      document.body.style.overflow = prevOverflow || "";
      document.removeEventListener("keydown", onKeydown);
    };

    $watch(
      () => $data.visible,
      (v) => {
        if (v) openDialog();
        else closeDialog();
      }
    );
    // 挂载即可见的边界场景
    if (visible) openDialog();
  </script>

  <script dispose>
    closeDialog();
    if (overlayEl && overlayEl.parentNode === document.body) {
      document.body.removeChild(overlayEl);
    }
  </script>
</html>
