<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Empty State Component">
  <title>Empty</title>
</head>
<style>
  body {
    display: block;
  }

  .v-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--v-spacing-xl) var(--v-spacing-md);
    text-align: center;
  }

  .v-empty-image {
    width: 120px;
    height: 90px;
    color: var(--v-text-color-disabled);
    margin-bottom: var(--v-spacing-md);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .v-empty-image svg {
    width: 100%;
    height: 100%;
  }

  .v-empty-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .v-empty-desc {
    color: var(--v-text-color-tertiary);
    font-size: var(--v-font-size-sm);
  }

  .v-empty-action {
    margin-top: var(--v-spacing-md);
  }

  .v-empty-action:empty {
    display: none;
  }
</style>

<body>
  <div class="v-empty">
    <vslot name="image" class="v-empty-image">
      <span v-if="image" class="v-empty-image"><img :src="image" alt="" /></span>
      <span v-else class="v-empty-image" v-html="defaultSvg"></span>
    </vslot>
    <div class="v-empty-desc">{{ description || $t('empty.noData') }}</div>
    <div class="v-empty-action">
      <vslot></vslot>
    </div>
  </div>
</body>
<script setup>
  description = ''; // 默认 $t('empty.noData')
  image = '';       // 自定义图片地址；默认内置 SVG 插画

  defaultSvg = '<svg viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="20" width="90" height="60" rx="4"></rect><path d="M15 35 L60 60 L105 35"></path><line x1="45" y1="10" x2="75" y2="10" opacity="0.5"></line><line x1="52" y1="4" x2="68" y2="4" opacity="0.3"></line></svg>';
</script>

</html>
