<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="Theme Switcher"
    details="Light / dark / system. Click cycles the preference through light → dark → auto. Only the preference is persisted; $theme applies the resolved light/dark value to documentElement.">
  <title>Theme Switcher</title>
</head>

<style>
  body {
    display: inline-block;
    /* 尺寸跟宿主高度走：外部直接给 v-theme 设 height 即可，宽度随纵横比 */
    height: 100%;
    min-height: 24px;
    aspect-ratio: 1 / 1;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: var(--v-text-color-secondary);
    cursor: pointer;
    user-select: none;
    position: relative;
    overflow: hidden;
    transition: color var(--v-transition-fast), transform var(--v-transition-base);
  }

  .theme-toggle:hover {
    color: var(--v-color-primary);
  }

  .theme-toggle:active {
    transform: scale(0.92);
  }

  .theme-icon {
    width: 15px;
    height: 15px;
    position: absolute;
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
    transition: opacity var(--v-transition-base), transform var(--v-transition-base);
  }

  .theme-toggle.light .icon-sun {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }

  .theme-toggle.dark .icon-moon {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }

  .theme-toggle.auto .icon-auto {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
</style>

<body>
  <div class="theme-toggle" :class="{light: preference === 'light', dark: preference === 'dark', auto: preference === 'auto'}"
    @click="cycleTheme()" :title="themeTitle()">
    <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <svg class="theme-icon icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2"></rect>
      <line x1="8" y1="20" x2="16" y2="20"></line>
      <line x1="12" y1="16" x2="12" y2="20"></line>
    </svg>
  </div>
</body>

<script setup>
  preference = $theme.get()
  themeTitle = () => {
    if (preference === 'light') return $t('theme.light')
    if (preference === 'dark') return $t('theme.dark')
    return $t('theme.auto')
  }
  cycleTheme = () => { $theme.cycle() }
  $scope.addCleanup($theme.subscribe(() => { preference = $theme.get() }))
</script>

</html>
