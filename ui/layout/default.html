<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Default Layout: Header + Centered Sidebar Shell">
  <title>Layout</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 与首页同宽的整体居中容器（vitepress 式） */
    .shell {
      flex: 1;
      min-height: 0;
      display: flex;
      width: 100%;
      max-width: var(--v-layout-max-width);
      margin: 0 auto;
      padding: 0 var(--v-spacing-lg);
    }

    .content-scroll {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: var(--v-spacing-xl) var(--v-spacing-lg);
    }

    vslot {
      display: contents;
    }
  </style>
</head>

<body>
  <layout-header></layout-header>

  <!-- 主体：侧边导航 + 内容区（与首页同宽居中） -->
  <div class="shell">
    <!-- 链接由 vrouter 自动拦截并同步 active -->
    <div vsrc="/sidebar.html" :items="menuItems" width="232px"></div>
    <main class="content-scroll">
      <vslot></vslot>
    </main>
  </div>

  <script setup>
    menuItems = [
      { label: () => $t('menu.home'), path: '/', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>' },
      ...$mod.navItems.map(item => ({
        label: () => $t(item.labelKey),
        path: '/c/' + item.name,
        icon: item.icon
      }))
    ];
  </script>
</body>

</html>
