<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Default Layout: Sidebar + Topbar">
  <title>Layout</title>
  <style>
    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--v-bg-color-secondary);
    }

    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--v-spacing-md);
      padding: 0 var(--v-spacing-lg);
      height: 56px;
      background: var(--v-bg-color);
      border-bottom: 1px solid var(--v-border-color);
    }

    .topbar-title {
      font-size: var(--v-font-size-lg);
      font-weight: var(--v-font-weight-bold);
      color: var(--v-text-color);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: var(--v-spacing-md);
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: var(--v-spacing-lg);
    }

    .sidebar-logo {
      padding: 0 var(--v-spacing-md);
      height: 56px;
      display: flex;
      align-items: center;
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--v-color-primary);
      border-bottom: 1px solid var(--v-border-color);
      white-space: nowrap;
    }

    vslot {
      display: contents;
    }
  </style>
</head>

<body>
  <!-- 侧边导航：复用 sidebar 组件，链接由 vrouter 自动拦截并同步 active -->
  <div vsrc="/sidebar.html" :items="menuItems" width="220px">
    <div vslot="header" class="sidebar-logo">{{ $t('app.logo') }}</div>
  </div>

  <!-- 主内容区 -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">{{ pageTitle() }}</div>
      <div class="topbar-actions">
        <div vsrc="/lang.html"></div>
        <div class="v-flex v-gap-sm">
          <div vsrc="/btn.html" size="sm" :variant="theme === 't1' ? 'default' : 'outline'"
            @click="setTheme('t1')">{{$t('theme.light')}}</div>
          <div vsrc="/btn.html" size="sm" :variant="theme === 't2' ? 'default' : 'outline'"
            @click="setTheme('t2')">{{$t('theme.dark')}}</div>
        </div>
      </div>
    </header>

    <div class="content-scroll">
      <vslot></vslot>
    </div>
  </main>

  <script setup>
    theme = $mod.theme.get();

    menuItems = [
      { label: () => $t('menu.home'), path: '/', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>' },
      ...$mod.navItems.map(item => ({
        label: () => $t(item.labelKey),
        path: '/c/' + item.name,
        icon: item.icon
      }))
    ];

    pageTitle = () => {
      const p = $router.current.path;
      const item = menuItems.find(i => i.path === p);
      return item ? item.label() : $t('app.logo');
    };

    setTheme = (t) => {
      theme = t;
      $mod.theme.set(t);
    };
  </script>
</body>

</html>
