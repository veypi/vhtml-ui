<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="Site Header: logo + theme toggle + lang" />
  <title>Header</title>
</head>
<style>
  body {
    display: block;
  }

  .nav {
    position: sticky;
    top: 0;
    z-index: var(--v-z-sticky);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--v-bg-color) 92%, transparent);
    border-bottom: 1px solid var(--v-border-color);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    max-width: var(--v-layout-max-width);
    margin: 0 auto;
    padding: 0 var(--v-spacing-lg);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: var(--v-spacing-sm);
    text-decoration: none;
    font-size: 18px;
    letter-spacing: -0.02em;
    font-weight: var(--v-font-weight-bold);
    color: var(--v-text-color);
  }

  .nav-logo-mark {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: var(--v-text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--v-bg-color);
    font-size: 14px;
    font-weight: var(--v-font-weight-bold);
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* vsrc 组件宿主必须显式约束尺寸；lang/theme 内部均为 100% SVG。 */
  .nav-actions>* {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border-radius: var(--v-radius-md);
    border: 1px solid transparent;
    background: transparent;
    color: var(--v-text-color-secondary);
    transition: background-color var(--v-transition-fast), border-color var(--v-transition-fast);
  }
</style>

<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/">
        <span class="nav-logo-mark">V</span>
        <span>{{ $t('app.logo') }}</span>
      </a>
      <div class="nav-actions">
        <div vsrc='theme'></div>
        <div vsrc="lang"></div>
      </div>
    </div>
  </header>
</body>

</html>
