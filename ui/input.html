<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Unified Input Component (Facade)">
  <title>Input</title>
</head>
<style>
  body {
    display: block;
    width: 100%;
    margin: var(--v-spacing-sm) 0;
  }

  .v-input-container {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: var(--v-spacing-md);
    width: 100%;
  }

  .v-label {
    font-size: var(--v-font-size-sm);
    color: var(--v-text-color);
    font-weight: var(--v-font-weight-medium);
    min-width: 80px;
    flex-shrink: 0;
    padding-top: 10px;
    line-height: 1.5;
  }

  .v-label.is-required::after {
    content: "*";
    color: var(--v-color-danger);
    margin-left: 4px;
  }

  .v-input-content {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    gap: 4px;
  }
</style>

<body>
  <div class="v-input-container">
    <label v-if="label" class="v-label" :class="{ 'is-required': required }">{{ label }}</label>

    <div class="v-input-content">
      <!-- Basic Input Types -->
      <div v-if="isBasic()" class="v-input-wrapper" :class="wrapperClass">
        <input class="v-input__inner" :type="type === 'datetime' ? 'datetime-local' : type" :value="value"
          :placeholder="placeholder" :disabled="disabled" :required='required' :readonly="readonly"
          :step="type === 'number' ? (opts?.step !== undefined ? opts?.step : 'any') : opts?.step"
          @input="handleInput" @blur="handleBlur" @focus="handleFocus" />
      </div>
      <div v-else-if='type==="textarea"' class="v-input-wrapper" :class="wrapperClass">
        <textarea class="v-input__inner" :value="value" :placeholder="placeholder" :disabled="disabled"
          :required='required' :readonly="readonly" @input="handleInput" @blur="handleBlur" @focus="handleFocus"
          :rows="opts?.rows || 3" style="resize: vertical;"></textarea>
      </div>

      <!-- Delegated Controls -->
      <div v-else-if='type==="select"' vsrc="/input/select.html" ref="ctrl" v:value="value"
        :placeholder="placeholder" :disabled="disabled" :required="required" :validate="validate" :opts="opts"
        :name="name" @change="forwardChange"></div>
      <div v-else-if='type==="checkbox"' vsrc="/input/checkbox.html" ref="ctrl" v:value="value"
        :placeholder="placeholder" :disabled="disabled" :required="required" :validate="validate" :opts="opts"
        :name="name" @change="forwardChange"></div>
      <div v-else-if='type==="radio"' vsrc="/input/radio.html" ref="ctrl" v:value="value" :disabled="disabled"
        :required="required" :validate="validate" :opts="opts" :name="name" @change="forwardChange"></div>
      <div v-else-if='type==="switch"' vsrc="/input/switch.html" ref="ctrl" v:value="value"
        :placeholder="placeholder" :disabled="disabled" :required="required" :validate="validate" :opts="opts"
        :name="name" @change="forwardChange"></div>
      <div v-else-if='type==="slider"' vsrc="/input/slider.html" ref="ctrl" v:value="value" :disabled="disabled"
        :required="required" :validate="validate" :opts="opts" :name="name" @change="forwardChange"></div>
      <div v-else-if='type==="range"' vsrc="/input/range.html" ref="ctrl" v:value="value" :disabled="disabled"
        :required="required" :validate="validate" :opts="opts" :name="name" @change="forwardChange"></div>
      <div v-else-if='type==="file"' vsrc="/input/upload.html" ref="ctrl" vslot-inherit v:value="value"
        :placeholder="placeholder" :disabled="disabled" :required="required" :validate="validate" :opts="opts"
        :name="name" :noborder="noborder" @change="forwardChange"></div>

      <div v-else>
        Not supported input type {{ type }}
      </div>

      <div v-if="errorMsg" class="v-error-msg">{{ errorMsg }}</div>
    </div>
  </div>
</body>
<script setup>
  // Props
  type = "text"; // text, password, number, email, search, tel, url, date, datetime, time, month, week, textarea,
                 // select, checkbox, radio, switch, slider, range, file
  value = "";
  label = "";
  name = "";
  placeholder = "";
  disabled = false;
  readonly = false;
  required = false;
  noborder = false;

  // validation: regex or function(val) -> true/string
  validate = null;

  // opts: extra options for different input types
  opts = {};

  // Internal state
  errorMsg = "";
  isFocused = false;

  basicTypes = ['text', 'password', 'number', 'email', 'search', 'tel', 'url', 'date', 'datetime-local', 'time', 'month', 'week', 'datetime'];
  isBasic = () => basicTypes.includes(type);

  delegatedTypes = ['select', 'checkbox', 'radio', 'switch', 'slider', 'range', 'file'];
  isDelegated = () => delegatedTypes.includes(type);

  wrapperClass = () => {
    let cls = [];
    if (disabled) cls.push("is-disabled");
    if (errorMsg) cls.push("is-error");
    if (noborder) cls.push("is-no-border");
    return cls.join(" ");
  }

  runCheck = (target) => {
    const r = $mod.checkValue({
      val: value,
      required,
      type,
      validate,
      opts,
      nativeTarget: target,
      $t
    });
    errorMsg = r.msg;
    return r;
  }

  // 供 form 聚合校验调用
  validateField = () => {
    if (isDelegated()) {
      return $refs.ctrl.$data.validateField();
    }
    return runCheck($node.querySelector('input, textarea'));
  }

  handleInput = (e) => {
    value = e.target.value;
    runCheck(e.target);
  }

  handleBlur = (e) => {
    isFocused = false;
    runCheck(e.target);
    $emit("v-blur", e);
  }

  handleFocus = (e) => {
    isFocused = true;
    $emit("v-focus", e);
  }

  forwardChange = (v) => $emit('change', v);
</script>

</html>
