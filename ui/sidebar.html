<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Sidebar Component">
  <title>Sidebar</title>
</head>
<style>
  .v-sidebar {
    display: flex;
    flex-direction: column;
    height: 100%;
    border-right: 1px solid var(--v-border-color);
    transition: width var(--v-transition-base);
    overflow: hidden;
    background-color: var(--v-bg-color);
    color: var(--v-text-color);
  }

  .v-sidebar-header {}

  .v-sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: var(--v-spacing-sm) 0;
  }

  .v-sidebar-footer {}

  /* Menu Items */
  .v-menu-item {
    display: flex;
    align-items: center;
    padding: var(--v-spacing-sm) var(--v-spacing-md);
    cursor: pointer;
    color: var(--v-text-color);
    transition: background-color var(--v-transition-fast), color var(--v-transition-fast);
    text-decoration: none;
    white-space: nowrap;
    user-select: none;
    font-size: var(--v-font-size-md);
    margin: 2px var(--v-spacing-sm);
    border-radius: var(--v-radius-md);
  }

  .v-menu-item:hover {
    background-color: var(--v-bg-color-secondary);
    color: var(--v-color-primary);
  }

  .v-menu-item[active] {
    background-color: var(--v-blue-50);
    color: var(--v-color-primary);
    font-weight: var(--v-font-weight-medium);
  }

  .v-menu-icon {
    width: 20px;
    height: 20px;
    margin-right: var(--v-spacing-sm);
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .v-menu-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .v-menu-arrow {
    width: 16px;
    height: 16px;
    transition: transform var(--v-transition-base);
  }

  .v-menu-arrow.is-expanded {
    transform: rotate(180deg);
  }

  /* Submenu */
  .v-submenu {
    overflow: hidden;
    transition: max-height var(--v-transition-base);
  }

  .v-submenu .v-menu-item {
    padding-left: calc(var(--v-spacing-md) + 20px + var(--v-spacing-sm));
    font-size: var(--v-font-size-sm);
  }

  /* Collapsed State */
  .v-sidebar.is-collapsed .v-menu-label,
  .v-sidebar.is-collapsed .v-menu-arrow,
  .v-sidebar.is-collapsed .v-sidebar-header span {
    display: none;
  }

  .v-sidebar.is-collapsed .v-menu-item {
    justify-content: center;
    padding: var(--v-spacing-sm);
    margin: 2px 4px;
  }

  .v-sidebar.is-collapsed .v-menu-icon {
    margin-right: 0;
  }

  /* Overlay mode (mobile) */
  .v-sidebar.is-overlay {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 999;
    transform: translateX(-100%);
    transition: transform var(--v-transition-base);
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
  }

  .v-sidebar.is-overlay.is-open {
    transform: translateX(0);
  }

  .v-sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 998;
    opacity: 0;
    transition: opacity var(--v-transition-base);
    pointer-events: none;
  }

  .v-sidebar-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .v-sidebar-pull-tab {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 997;
    width: 32px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--v-text-color-secondary);
    transition: opacity var(--v-transition-base);
    user-select: none;
  }

  .v-sidebar-pull-tab:hover {
    color: var(--v-color-primary);
  }

  .v-pull-arrow {
    position: relative;
    width: 18px;
    height: 44px;
  }

  .v-pull-arrow::before,
  .v-pull-arrow::after {
    content: '';
    position: absolute;
    left: 0;
    width: 2px;
    border-radius: 1px;
    background: currentColor;
    opacity: 0.45;
  }

  .v-pull-arrow::before {
    top: 0;
    height: 22px;
    transform: rotate(-15deg);
  }

  .v-pull-arrow::after {
    top: 22px;
    height: 22px;
    transform: rotate(15deg);
  }

  .v-sidebar-pull-tab:hover .v-pull-arrow::before,
  .v-sidebar-pull-tab:hover .v-pull-arrow::after {
    opacity: 0.7;
  }

  vslot {
    display: contents;
  }
</style>

<body>
  <!-- Overlay backdrop (mobile) -->
  <div v-if="overlay" class="v-sidebar-overlay" :class="open ? 'is-open' : ''" @click="close"></div>

  <!-- Pull tab (mobile, visible when closed) -->
  <div v-if="overlay && !open" class="v-sidebar-pull-tab" @click="open = true">
    <div class="v-pull-arrow"></div>
  </div>

  <div class="v-sidebar"
    :class="overlay ? (open ? 'is-overlay is-open' : 'is-overlay') : (collapsed ? 'is-collapsed' : '')"
    :style="{width: overlay ? width : (collapsed ? collapsedWidth : width)}">

    <!-- Header -->
    <vslot class="v-sidebar-header" name="header">
    </vslot>

    <!-- Body -->
    <div class="v-sidebar-body">
      <div v-for="item in items">

        <!-- Parent Item (Group Header) -->
        <div v-if="item.children" class="v-menu-item" @click="toggleExpand(item)" :title="collapsed ? item.label : ''">
          <div class="v-menu-icon" v-if="item.icon" v-html="item.icon"></div>
          <span class="v-menu-label">{{ item.label }}</span>
          <svg v-if="!collapsed" class="v-menu-arrow" :class="item.expanded ? 'is-expanded' : ''" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <!-- Leaf Item (Link) -->
        <a v-else class="v-menu-item" :href="pathPrefix + item.path" @click="onSelect(item)"
          :title="collapsed ? item.label : ''">
          <div class="v-menu-icon" v-if="item.icon" v-html="item.icon"></div>
          <span class="v-menu-label">{{ item.label }}</span>
        </a>

        <!-- Children -->
        <div v-if="item.children && !collapsed" class="v-submenu" :style="{maxHeight: item.expanded ? '500px' : '0'}">
          <a v-for="subItem in item.children" class="v-menu-item" :href="pathPrefix + subItem.path"
            @click="onSelect(subItem)" :title="subItem.label">
            <div class="v-menu-icon" v-if="subItem.icon" v-html="subItem.icon"></div>
            <span class="v-menu-label">{{ subItem.label }}</span>
          </a>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <vslot class="v-sidebar-footer" name="footer">
    </vslot>
  </div>
</body>
<script setup>
  items = []; // [{label, icon, path, children, expanded}]
  collapsed = false;
  width = '240px';
  collapsedWidth = '64px';
  pathPrefix = '@'
  overlay = window.innerWidth < 768;
  open = false;

  toggleExpand = (item) => {
    item.expanded = !item.expanded;
  };

  close = () => {open = false;};

  onSelect = (item) => {
    $emit('select', item);
    if (overlay) open = false;
  };
</script>
<script>
  let ofNode = $node.parentNode.closest('*[vref]')
  if (ofNode.$mod.scoped) {
    pathPrefix = '@' + ofNode.$mod.scoped
  }

  const mq = window.matchMedia('(max-width: 767px)');
  overlay = mq.matches;
  mq.addEventListener('change', (e) => {
    overlay = e.matches;
    if (!e.matches) open = false;
  });
</script>

</html>
