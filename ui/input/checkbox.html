<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Checkbox Control (Single & Group)">
  <title>Checkbox</title>
</head>
<style>
  body {
    display: block;
    width: 100%;
  }

  .v-checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--v-spacing-md);
    min-height: 40px;
    align-items: center;
  }

  .v-checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: var(--v-font-size-md);
    color: var(--v-text-color);
    user-select: none;
  }

  .v-checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin: 0;
    cursor: pointer;
    accent-color: var(--v-color-primary);
  }

  .v-checkbox-label.is-disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .v-checkbox-label.is-disabled input {
    cursor: not-allowed;
  }
</style>

<body>
  <!-- Group Mode -->
  <div v-if="opts?.options" class="v-checkbox-group">
    <label v-for="(opt, idx) in opts?.options" class="v-checkbox-label"
      :class="{ 'is-disabled': disabled || opt.disabled }">
      <input type="checkbox" :value="opt.value !== undefined ? opt.value : opt"
        :checked="Array.isArray(value) && value.includes(opt.value !== undefined ? opt.value : opt)"
        :disabled="disabled || opt.disabled" @change="handleGroupChange">
      <span>{{ opt.label !== undefined ? opt.label : opt }}</span>
    </label>
  </div>
  <!-- Single Mode -->
  <div v-else class="v-checkbox-group">
    <label class="v-checkbox-label" :class="{ 'is-disabled': disabled }">
      <input type="checkbox" :checked="value" :disabled="disabled" :required="required" @change="handleSingleChange">
      <span>{{ placeholder }}</span>
    </label>
  </div>
  <div v-if="errorMsg" class="v-error-msg">{{ errorMsg }}</div>
</body>
<script setup>
  value = false; // Single: boolean; Group: Array
  placeholder = "";
  disabled = false;
  required = false;
  validate = null;
  opts = {};
  name = "";
  errorMsg = "";

  validateField = () => {
    const r = $mod.checkValue({ val: value, required, type: 'checkbox', validate, opts, $t });
    errorMsg = r.msg;
    // 组模式下同步所有 input 的 customValidity，保证原生 form 校验一致
    $node.querySelectorAll('input[type="checkbox"]').forEach(i => {
      if (i.setCustomValidity) i.setCustomValidity(r.valid ? '' : r.msg);
    });
    return r;
  }

  handleGroupChange = (e) => {
    const target = e.target;
    const val = target.value;
    const checked = target.checked;
    let newValue = Array.isArray(value) ? [...value] : [];

    let originalVal = val;
    const foundOpt = opts?.options.find(opt => {
      const v = opt.value !== undefined ? opt.value : opt;
      return String(v) === val;
    });
    if (foundOpt) {
      originalVal = foundOpt.value !== undefined ? foundOpt.value : foundOpt;
    }

    if (checked) {
      if (!newValue.includes(originalVal)) newValue.push(originalVal);
    } else {
      newValue = newValue.filter(v => v !== originalVal);
    }
    value = newValue;
    validateField();
    $emit('update', value);
  }

  handleSingleChange = (e) => {
    value = e.target.checked;
    validateField();
    $emit('update', value);
  }
</script>
<script>
  // 外部重置 value 时，若已显示错误则重新校验
  $watch(() => $data.value, () => {
    if ($data.errorMsg) $data.validateField();
  })
</script>

</html>
